<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>OCMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="hls.min.js"></script>
<style>
/* Layout: Sendezentrale — Kopfleiste, dann drei Spalten (Gruppen · Kanäle · Player). Mobil: Player oben, Gruppen als Chips, Kanalliste darunter. */
:root{
  --bg:#0b0f14; --panel:#10171f; --raise:#17212c; --raise-2:#1e2a37; --line:#213042;
  --fg:#e6ecf4; --muted:#8a98ad; --dim:#5b697e;
  --tally:#ffb020; --tally-ink:#1b1303; --live:#ff4d5e; --focus:#6aa8ff; --ok:#3ecf8e;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --hdr:58px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.sm .ic,.ic.sm{width:15px;height:15px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Kopfleiste */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:var(--hdr);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.01em;display:flex;align-items:center;gap:3px;white-space:nowrap;user-select:none}
.brand b{background:var(--tally);color:var(--tally-ink);padding:0 5px;border-radius:4px;margin-right:1px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:7px 12px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--raise);box-shadow:inset 0 -2px 0 var(--tally)}
.hdr-right{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.search{position:relative;width:260px;max-width:100%}
.search input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 34px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.pill{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:999px;background:var(--raise);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{color:var(--ok)} .pill.busy{color:var(--tally)} .pill.err{color:var(--live)}
select.plsel{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:170px}

/* Ansichten */
.view{display:none}
.view.on{display:block}
#live.on{display:grid;grid-template-columns:220px minmax(300px,380px) minmax(0,1fr);height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.col{overflow-y:auto;min-width:0;border-right:1px solid var(--line)}
.col:last-child{border-right:0}

/* Gruppen */
.groups{padding:10px 8px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.gh{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:10px 10px 4px}
.grp{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--muted)}
.grp:hover{background:var(--raise);color:var(--fg)}
.grp[aria-current="true"]{background:var(--raise-2);color:var(--fg)}
.grp .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gc{font-family:var(--f-mono);font-size:11px;color:var(--dim)}

/* Kanalliste */
.chhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.chhead h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chhead span{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.chlist{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--fg)}
.row:hover{background:var(--panel)}
.row:focus-visible{outline-offset:-2px}
.row.on{background:var(--raise);box-shadow:inset 3px 0 0 var(--tally)}
.row .num{font-family:var(--f-mono);font-size:12px;color:var(--dim);text-align:right}
.logo{position:relative;width:44px;height:32px;border-radius:5px;background:var(--raise-2);display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.02em}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--raise-2);padding:3px}
.meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--tally);border-radius:2px}
.flags{display:flex;gap:4px;color:var(--dim)}
.flags .fav{color:var(--tally)}
.empty{padding:28px 18px;color:var(--muted);line-height:1.55}
.empty b{color:var(--fg)}
.sent{height:1px}
.hits-h{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:16px 14px 6px}
.hit{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;color:var(--fg)}
.hit:hover{background:var(--panel)}
.hit .mono{font-size:12px;color:var(--muted);flex:0 0 auto}
.hit small{display:block;color:var(--muted);font-size:12px}

/* Player */
.player-col{background:var(--bg);display:flex;flex-direction:column}
.stage{position:relative;background:#000;aspect-ratio:16/9;max-width:100%;width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,#121b26 0%,#05070a 75%);color:var(--muted);line-height:1.5}
.stage-msg .big{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--fg);margin-bottom:6px}
.stage-msg .err{color:var(--live)}
.stage-msg .msgbox{max-width:520px}
.osd{position:absolute;top:14px;right:14px;background:rgba(5,8,12,.82);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:var(--f-display);font-size:22px;font-weight:600;pointer-events:none;display:flex;gap:10px;align-items:baseline}
.osd .mono{color:var(--tally);font-size:20px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 11px;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--raise-2)}
.btn.icon{padding:7px 8px}
.btn.on{color:var(--tally);border-color:#5a4416}
.btn.primary{background:var(--tally);color:var(--tally-ink);border-color:var(--tally);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--live)}
.btn[disabled]{opacity:.45;cursor:default}
.ctrl select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 8px;max-width:150px}
.spacer{flex:1}
.info{padding:16px 18px 6px}
.info .chline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.tag.live{background:var(--live);color:#fff}
.tag.cu{background:var(--focus);color:#06121f}
.info h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin:8px 0 4px;text-wrap:balance}
.info .time{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.info .time .bar{flex:1;max-width:260px;margin:0}
.info p{color:var(--muted);margin:10px 0 0;max-width:68ch;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.info .next{margin-top:12px;font-size:14px;color:var(--muted)}
.info .next b{color:var(--fg);font-weight:500}
.info .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sched{padding:6px 18px 24px}
.sched h3{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;font-weight:600}
.sched ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sched li button{display:grid;grid-template-columns:52px minmax(0,1fr) 22px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;color:var(--fg)}
.sched li button:hover{background:var(--panel)}
.sched li .mono{font-size:12px;color:var(--muted)}
.sched li.past button{color:var(--muted)}
.sched li.cur button{color:var(--tally)}
.sched li.cur .mono{color:var(--tally)}
.sched .dayh{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--dim);padding:10px 4px 4px;text-transform:uppercase}

/* TV-Guide */
.gtool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.gtool select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 8px;max-width:220px}
.gtool .gdate{font-family:var(--f-display);font-size:18px;font-weight:600;margin-left:6px}
.gw{overflow:auto;height:calc(100dvh - var(--hdr) - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));position:relative}
.gr{display:flex;border-bottom:1px solid var(--line);width:max-content}
.gch{position:sticky;left:0;z-index:3;flex:0 0 170px;width:170px;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;height:58px;text-align:left;border-top:0;border-bottom:0;border-left:0;color:var(--fg)}
.gch .nm{font-size:14px}
.gch .num{font-family:var(--f-mono);font-size:11px;color:var(--dim);width:24px;text-align:right;flex:0 0 auto}
.gtrack{position:relative;height:58px;flex:0 0 auto}
.ghead{position:sticky;top:0;z-index:4;background:var(--bg)}
.ghead .gch{height:34px;z-index:5;font-family:var(--f-display);font-size:13px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.ghead .gtrack{height:34px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:8px 0 0 6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.gp{position:absolute;top:4px;bottom:4px;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:6px 8px;overflow:hidden;text-align:left;color:var(--fg);display:flex;flex-direction:column;justify-content:center;min-width:0}
.gp:hover{background:var(--raise-2);z-index:1}
.gp b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.gp.past{background:var(--panel);color:var(--muted)}
.gp.cur{background:#2a2312;border-color:#5a4416}
.gp.cur b{color:var(--tally)}
.gp.none{background:transparent;border-style:dashed;color:var(--dim)}
.gp .ic{position:absolute;right:5px;top:5px;color:var(--focus)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--live);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--live)}

/* Multiview */
.mvtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.mvtool .hint{color:var(--muted);font-size:13px}
.mvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.mvgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{position:relative;background:#000;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:2px solid transparent}
.slot.focus{border-color:var(--tally)}
.slot video{position:absolute;inset:0;width:100%;height:100%}
.slot .sbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px}
.slot .sbar .nm{flex:1;min-width:0}
.slot .pick{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel);border:0;color:var(--muted);font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
.slot .pick:hover{color:var(--fg);background:var(--raise)}
.slot .aud{position:absolute;top:8px;left:8px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;background:var(--tally);color:var(--tally-ink);padding:2px 7px;border-radius:4px}

/* Einstellungen */
.set{max-width:880px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.set section{display:flex;flex-direction:column;gap:12px}
.set h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em}
.set h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:4px 0 0;letter-spacing:.02em}
.set .sub{color:var(--muted);margin:0;max-width:70ch;line-height:1.55}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.plrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.plrow:last-child{border-bottom:0;padding-bottom:0}
.plrow:first-child{padding-top:0}
.plrow .pmeta{flex:1;min-width:180px}
.plrow .pmeta b{display:block;font-weight:600}
.plrow .pmeta small{color:var(--muted);font-family:var(--f-mono);font-size:12px;word-break:break-all}
.plrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;color:var(--muted)}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise-2);color:var(--fg)}
.gtable{width:100%;border-collapse:collapse;font-size:14px}
.gtable th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
.gtable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.gtable td.c{text-align:center;width:90px}
.gtable input{width:18px;height:18px;accent-color:var(--tally)}
.tw{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;color:var(--muted)}
.keys kbd{font-family:var(--f-mono);font-size:12px;background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 7px;color:var(--fg);white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* Modal + Toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,8,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:85dvh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;text-wrap:balance}
.sheet .sub{color:var(--muted);margin:0;font-size:14px}
.sheet p{margin:0;line-height:1.55;color:var(--muted)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pinin{font-family:var(--f-mono);font-size:28px;letter-spacing:.5em;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.picklist{display:flex;flex-direction:column;max-height:50dvh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--raise-2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}

/* Schmal */
@media (max-width:899px){
  .hdr{flex-wrap:wrap;padding-top:8px;padding-bottom:8px;row-gap:8px}
  .brand{flex:0 0 auto}
  .hdr-right{display:contents}
  select.plsel{order:1;margin-left:auto}
  #epgPill{order:2}
  .nav{order:3;width:100%}
  .search{order:4;width:100%}
  #live.on{display:flex;flex-direction:column;height:auto}
  .col{border-right:0;overflow:visible}
  .player-col{order:-1}
  .groups{flex-direction:row;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px));gap:6px;border-bottom:1px solid var(--line)}
  .groups .gh{display:none}
  .grp{width:auto;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .grp .gn{overflow:visible}
  .chhead{position:static}
  .info h1{font-size:24px}
  .gw{height:calc(100dvh - 150px)}
  .gch{flex-basis:118px;width:118px;padding:0 8px}
  .gch .logo{display:none}
  .mvgrid{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand" aria-label="OCMate"><b>OC</b>Mate</div>
  <nav class="nav" aria-label="Bereiche">
    <button data-view="live" aria-current="true">Live TV</button>
    <button data-view="guide">TV-Guide</button>
    <button data-view="multi">Multiview</button>

/* ---------- Demo ---------- */
const DEMO_M3U=`#EXTM3U
#EXTINF:-1 tvg-id="demo.bbb" tvg-chno="1" group-title="Demo · Filme",Big Buck Bunny
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-id="demo.tos" tvg-chno="2" group-title="Demo · Filme",Tears of Steel

#EXTINF:-1 tvg-id="demo.bipbop" tvg-chno="4" group-title="Demo · Testbild",Apple Bipbop
https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_16x9/bipbop_16x9_variant.m3u8`;
const DEMO_TITLES=[['Nachrichten','Der Überblick über die Themen des Tages.'],['Wetter','Aussichten für die nächsten Tage.'],['Spielfilm','Demo-Eintrag: erfundenes Programm, nur damit der TV-Guide etwas zeigt.'],['Doku: Hafenstädte','Demo-Eintrag: Eine Reise entlang der Nordseeküste.'],['Magazin','Demo-Eintrag: Technik, Autos und Werkstatt-Alltag.'],['Serie','Demo-Eintrag: Folge 4 der zweiten Staffel.'],['Sport kompakt','Demo-Eintrag: Ergebnisse und Highlights.'],['Talk am Abend','Demo-Eintrag: Gäste und Gespräche.']];
function demoEPG(chs){
  const map=new Map();const base=Math.floor(Date.now()/18e5)*18e5-24*36e5;
  chs.forEach((ch,ci)=>{const arr=[];let t=base,i=ci*3;while(t<base+48*36e5){const len=[30,45,60,90][(i*7+ci)%4]*6e4;const it=DEMO_TITLES[i%DEMO_TITLES.length];arr.push({start:t,stop:t+len,title:it[0],desc:it[1]});t+=len;i++}
    const id=(ch.tvgId||ch.name).toLowerCase();map.set(id,arr);ch.epgId=id});

}

/* ---------- M3U ---------- */
function commaIdx(l){let q=false;for(let i=8;i<l.length;i++){const c=l[i];if(c==='"')q=!q;else if(c===','&&!q)return i}return -1}
function parseAttrs(s){const o={};s.replace(/([\w-]+)=(?:"([^"]*)"|'([^']*)'|([^\s,"']+))/g,(m,k,a,b,c)=>{o[k.toLowerCase()]=a??b??c??'';return m});return o}
function parseM3U(text,pid){
  const lines=String(text).replace(/^﻿/,'').split(/\r?\n/);const out=[];let meta=null,head={};
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(/^#EXTM3U/i.test(l)){head=parseAttrs(l);continue}
    if(/^#EXTINF/i.test(l)){const ci=commaIdx(l);meta={a:parseAttrs(ci<0?l:l.slice(0,ci)),name:ci<0?'':l.slice(ci+1).trim()};continue}
    if(/^#EXTGRP:/i.test(l)){if(meta)meta.grp=l.slice(8).trim();continue}
    if(l[0]==='#')continue;
    const a=meta?meta.a:{};
    const name=(meta&&meta.name)||a['tvg-name']||l.split('/').pop();
    const cu=(a['catchup']||a['catchup-type']||((a['timeshift']||a['tvg-rec'])?'default':'')).toLowerCase();
    const days=+(a['catchup-days']||a['timeshift']||a['tvg-rec']||0);
    out.push({pid,name,url:l,group:a['group-title']||(meta&&meta.grp)||'Ohne Gruppe',logo:a['tvg-logo']||a['logo']||'',
      tvgId:a['tvg-id']||'',tvgName:a['tvg-name']||'',num:parseInt(a['tvg-chno']||a['channel-number']||'0',10)||0,
      catchup:cu?{mode:cu,days:days||7,source:a['catchup-source']||''}:null});
    meta=null;
  }
  const epg=(head['x-tvg-url']||head['url-tvg']||'').split(',')[0].trim();
  return{list:out,epgUrl:epg};
}

/* ---------- Xtream Codes ---------- */
function xtBase(p){let s=p.server.trim().replace(/\/+$/,'');if(!/^https?:\/\//i.test(s))s='http://'+s;return s}
function xtQ(p){return'username='+encodeURIComponent(p.user)+'&password='+encodeURIComponent(p.pass)}
async function httpErr(r){let t='';try{t=(await r.text()).slice(0,160)}catch(e){}return new Error('HTTP '+r.status+(t?' – '+t:''))}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw await httpErr(r);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('Antwort ist kein JSON: '+t.slice(0,120))}}
async function loadXtream(p){
  const b=xtBase(p),q=xtQ(p);
  const info=await getJSON(`${b}/player_api.php?${q}`);
  if(info&&info.user_info&&info.user_info.auth===0)throw new Error('Login abgelehnt: Benutzername oder Passwort falsch.');
  const[cats,streams]=await Promise.all([getJSON(`${b}/player_api.php?${q}&action=get_live_categories`),getJSON(`${b}/player_api.php?${q}&action=get_live_streams`)]);
  const cm={};(cats||[]).forEach(c=>cm[c.category_id]=c.category_name);
  const ext=p.ext||'m3u8';const u=encodeURIComponent(p.user),pw=encodeURIComponent(p.pass);
  const list=(streams||[]).map(s=>({pid:p.id,name:s.name||('Kanal '+s.stream_id),url:`${b}/live/${u}/${pw}/${s.stream_id}.${ext}`,
    group:cm[s.category_id]||'Ohne Gruppe',logo:s.stream_icon||'',tvgId:s.epg_channel_id||'',tvgName:'',num:+s.num||0,
    catchup:+s.tv_archive===1?{mode:'xc',days:+s.tv_archive_duration||1,source:''}:null,
    xc:{base:b,user:u,pass:pw,id:s.stream_id,ext}}));
  const exp=info&&info.user_info&&info.user_info.exp_date?+info.user_info.exp_date*1000:0;
  return{list,epgUrl:`${b}/xmltv.php?${q}`,exp};
}

/* ---------- Kanäle aufbereiten ---------- */
function finalize(list){
  const seen=new Map();let n=0;
  list.forEach(c=>{n++;if(!c.num)c.num=n;let k=c.pid+'|'+c.name+'|'+c.tvgId;const d=seen.get(k)||0;seen.set(k,d+1);if(d)k+='#'+d;c.key=k});
  S.channels=list;S.byKey=new Map(list.map(c=>[c.key,c]));
  const g=new Map();list.forEach(c=>g.set(c.group,(g.get(c.group)||0)+1));
  S.groups=[...g].map(([name,count])=>({name,count}));
}
const isHidden=c=>arrOf(P.hidden,c.pid).includes(c.group);
const isLockedGroup=(pid,g)=>arrOf(P.locked,pid).includes(g);
const isLocked=c=>isLockedGroup(c.pid,c.group);
const isFav=c=>arrOf(P.fav,c.pid).includes(c.key);

/* ---------- EPG / XMLTV ---------- */
function decodeEnt(s){return String(s).replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(m,e)=>{const l=e.toLowerCase();if(l==='amp')return'&';if(l==='lt')return'<';if(l==='gt')return'>';if(l==='quot')return'"';if(l==='apos')return"'";const n=l[1]==='x'?parseInt(l.slice(2),16):parseInt(l.slice(1),10);return isNaN(n)?m:String.fromCodePoint(n)})}
function attr(s,k){const m=s.match(new RegExp('(?:^|\\s)'+k+'\\s*=\\s*"([^"]*)"'));return m?m[1]:''}
function xmltvTime(s){const m=String(s).match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return NaN;const tz=m[7]||'+0000';const off=(tz[0]==='-'?-1:1)*(+tz.slice(1,3)*60+ +tz.slice(3,5));return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))-off*6e4}
function parseXMLTVChannels(text){
  const ids=new Set(),names=new Map();const re=/<channel\b([^>]*)>([\s\S]*?)<\/channel>/g;let m;
  while((m=re.exec(text))){const id=decodeEnt(attr(m[1],'id')).toLowerCase();ids.add(id);const rn=/<display-name[^>]*>([\s\S]*?)<\/display-name>/g;let n;while((n=rn.exec(m[2]))){const k=norm(decodeEnt(n[1]));if(k&&!names.has(k))names.set(k,id)}}
  return{ids,names};
}
function parseProgrammes(text,wanted,off,from,to){
  const map=new Map();const re=/<programme\b([^>]*)>([\s\S]*?)<\/programme>/g;let m;
  while((m=re.exec(text))){const ch=decodeEnt(attr(m[1],'channel')).toLowerCase();if(!wanted.has(ch))continue;
    const st=xmltvTime(attr(m[1],'start'))+off;let sp=xmltvTime(attr(m[1],'stop'))+off;if(isNaN(st))continue;
    if(!((isNaN(sp)?st+36e5:sp)>from&&st<to))continue;
    const t=m[2].match(/<title[^>]*>([\s\S]*?)<\/title>/),d=m[2].match(/<desc[^>]*>([\s\S]*?)<\/desc>/);
    let a=map.get(ch);if(!a)map.set(ch,a=[]);
    a.push({start:st,stop:sp,title:t?decodeEnt(t[1]).trim():'Ohne Titel',desc:d?decodeEnt(d[1]).trim():''});}
  for(const a of map.values()){a.sort((x,y)=>x.start-y.start);for(let i=0;i<a.length;i++){if(isNaN(a[i].stop)||a[i].stop<=a[i].start)a[i].stop=a[i+1]?a[i+1].start:a[i].start+18e5}}
  return map;
}
function applyEPG(text,label){
  const{ids,names}=parseXMLTVChannels(text);const wanted=new Set();let matched=0;
  for(const c of S.channels){let id='';const t=(c.tvgId||'').toLowerCase();
    if(t&&ids.has(t))id=t;else id=names.get(norm(c.tvgName))||names.get(norm(c.name))||(t&&ids.size===0?t:'');
    c.epgId=id||'';if(id){wanted.add(id);matched++}}
  const now=Date.now();S.epg=parseProgrammes(text,wanted,P.epgOffset*36e5,now-8*864e5,now+5*864e5);
  let progs=0;for(const a of S.epg.values())progs+=a.length;
  S.epgInfo={state:'ok',label,channels:ids.size,matched,progs,at:now};
}
async function fetchText(url){
  const r=await fetch(url);if(!r.ok)throw await httpErr(r);
  return bufToText(new Uint8Array(await r.arrayBuffer()));
}
async function bufToText(buf){
  if(buf[0]===0x1f&&buf[1]===0x8b){if(!('DecompressionStream' in window))throw new Error('Dieser Browser kann .gz nicht entpacken.');
    const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text()}
  return new TextDecoder().decode(buf);
}
function epgUrlFor(p){return p.epgUrl||S.headerEpg||''}
async function loadEPG(p){
  if(p.type==='demo'){S.epg=demoEPG(S.channels);let n=0;for(const a of S.epg.values())n+=a.length;S.epgInfo={state:'ok',label:'Demo-EPG (erfundenes Programm)',channels:S.channels.length,matched:S.channels.length,progs:n,at:Date.now()};epgPill();refreshAll();return}
  const url=epgUrlFor(p);if(!url){S.epgInfo={state:'none'};epgPill();return}
  S.epgInfo={state:'busy'};epgPill();
  try{const text=await fetchText(url);if(P.activeId!==p.id)return;S.epgText=text;applyEPG(text,url);}
  catch(e){S.epgInfo={state:'err',msg:netMsg(e)}}
  epgPill();refreshAll();
}
function epgPill(){const e=S.epgInfo,el=$('#epgPill');el.className='pill';
  if(e.state==='ok'){el.classList.add('ok');el.textContent='EPG '+e.matched+'/'+S.channels.length}
  else if(e.state==='busy'){el.classList.add('busy');el.textContent='EPG lädt…'}
  else if(e.state==='err'){el.classList.add('err');el.textContent='EPG Fehler'}
  else el.textContent='EPG –';
  el.title=e.state==='err'?e.msg:(e.label||'');
}
const progsOf=c=>(c&&c.epgId&&S.epg.get(c.epgId))||[];
function nowIdx(a,t){let lo=0,hi=a.length-1;while(lo<=hi){const m=(lo+hi)>>1;if(a[m].stop<=t)lo=m+1;else if(a[m].start>t)hi=m-1;else return m}return-1}
const curProg=c=>{const a=progsOf(c),i=nowIdx(a,Date.now());return i<0?null:a[i]};
const pct=p=>Math.max(0,Math.min(100,(Date.now()-p.start)/(p.stop-p.start)*100));

/* ---------- Catch-up ---------- */
function fillTpl(t,st,sp){
  const d=new Date(st),e=new Date(sp),u=Math.floor(st/1000),eu=Math.floor(sp/1000),now=Math.floor(Date.now()/1000);
  const fmt=(f,b)=>f.replace(/Y|m|d|H|M|S/g,c=>({Y:b.getFullYear(),m:pad(b.getMonth()+1),d:pad(b.getDate()),H:pad(b.getHours()),M:pad(b.getMinutes()),S:pad(b.getSeconds())}[c]));
  return t.replace(/\$?\{(utc|start|end|utcend|lutc|now|timestamp|duration|offset|Y|m|d|H|M|S)(?::([^}]*))?\}/g,(m,k,f)=>{
    if(f)return fmt(f,(k==='end'||k==='utcend')?e:d);
    switch(k){case'utc':case'start':return u;case'end':case'utcend':return eu;case'lutc':case'now':case'timestamp':return now;
      case'duration':return eu-u;case'offset':return now-u;default:return fmt(k,d)}});
}
function xcParts(c){if(c.xc)return c.xc;const m=c.url.match(/^(https?:\/\/[^/]+)\/(?:live\/)?([^/]+)\/([^/]+)\/(\d+)(?:\.(\w+))?$/);return m?{base:m[1],user:m[2],pass:m[3],id:m[4],ext:m[5]||'ts'}:null}
function catchupUrl(c,p){
  const cu=c.catchup||{mode:'default'},mode=cu.mode,u=Math.floor(p.start/1000),lu=Math.floor(Date.now()/1000),dur=Math.max(60,Math.floor((p.stop-p.start)/1000));
  const q=s=>c.url+(c.url.includes('?')?'&':'?')+s;
  const x=xcParts(c);
  if(x&&(mode==='xc'||(!cu.source&&(mode==='default'||mode==='')))){const d=new Date(p.start);
    return`${x.base}/timeshift/${x.user}/${x.pass}/${Math.ceil(dur/60)}/${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}:${pad(d.getHours())}-${pad(d.getMinutes())}/${x.id}.${x.ext||'m3u8'}`}
  if(mode==='flussonic'||mode==='fs')return c.url.replace(/\/([^/?]*?)(?:-\w+)?\.m3u8/,`/index-${u}-${dur}.m3u8`);
  if(mode==='append')return c.url+fillTpl(cu.source||'?utc={utc}&lutc={lutc}',p.start,p.stop);
  if(mode==='shift')return q(`utc=${u}&lutc=${lu}`);
  if(cu.source)return fillTpl(cu.source,p.start,p.stop);
  return q(`utc=${u}&lutc=${lu}`);
}

function stopVideo(v){if(v._hls){v._hls.destroy();v._hls=null}v.pause();v.removeAttribute('src');v.load()}
function playUrl(v,url,onErr,onReady){
  stopVideo(v);
  if(!IN_APP&&location.protocol==='https:'&&/^http:/i.test(url)){onErr('mixed');return}
  const isHls=/\.m3u8(\?|$)/i.test(url)||/[?&](type|output|extension)=(m3u8|hls)/i.test(url);
  if(isHls&&window.Hls&&Hls.isSupported()){
    const h=new Hls({enableWorker:true,backBufferLength:30,maxBufferLength:30});v._hls=h;let tries=0;
    h.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});onReady&&onReady(h)});
    h.on(Hls.Events.ERROR,(ev,d)=>{if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries<2&&d.details!=='manifestLoadError'){tries++;h.startLoad();return}
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&tries<2){tries++;h.recoverMediaError();return}
      onErr(d.details==='manifestLoadError'||d.details==='manifestLoadTimeOut'?'net':'media')});
    h.loadSource(url);h.attachMedia(v);
  }else{
    v.src=url;v.onerror=()=>onErr(/\.ts(\?|$)/i.test(url)?'ts':'media');
    v.onloadedmetadata=()=>onReady&&onReady(null);v.play().catch(()=>{});
  }
}

          <div class="grid2"><div class="fld"><label for="aUser">Benutzername</label><input id="aUser" required autocomplete="off"></div><div class="fld"><label for="aPass">Passwort</label><input id="aPass" type="password" required autocomplete="off"></div></div>
          <div class="fld"><label for="aExt">Stream-Format</label><select id="aExt"><option value="m3u8">HLS (m3u8) – empfohlen für Browser</option><option value="ts">MPEG-TS (ts)</option></select></div>`:''}
        ${addMode!=='xtream'?`<div class="fld"><label for="aEpg">EPG-Link (XMLTV, optional)</label><input id="aEpg" type="url" placeholder="Leer lassen, wenn die Playlist einen EPG-Link enthält"></div>`:''}
        <div><button class="btn primary" type="submit">Hinzufügen und laden</button></div>
      </form>
    </div></section>
  <section><h2>EPG</h2><p class="sub">${esc(p?p.name:'')} · ${epgState}</p>
    <div class="card">
      ${p&&p.type!=='demo'?`<div class="fld"><label for="eUrl">EPG-Link (XMLTV, auch .gz)</label><input id="eUrl" type="url" value="${esc(p.epgUrl||'')}" placeholder="${esc(S.headerEpg||(p.type==='xtream'?'Vom Xtream-Server':'https://…/epg.xml.gz'))}"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="epgSave">Speichern und laden</button><label class="btn" for="eFile">EPG-Datei laden</label><input id="eFile" type="file" accept=".xml,.gz,.xmltv" hidden></div>`:'<p class="note">Die Demo nutzt ein erfundenes Programm.</p>'}
      <div class="grid3"><div class="fld"><label for="eOff">Zeitversatz in Stunden</label><input id="eOff" type="number" step="0.5" min="-12" max="12" value="${P.epgOffset}"></div></div>
    </div></section>
  <section><h2>Gruppen</h2><p class="sub">Ausgeblendete Gruppen verschwinden aus Listen und Guide. Gesperrte Gruppen brauchen die PIN.</p>
    <div class="tw"><table class="gtable"><thead><tr><th>Gruppe</th><th>Kanäle</th><th style="text-align:center">Ausblenden</th><th style="text-align:center">Sperren</th></tr></thead><tbody>
    ${S.groups.map((g,i)=>`<tr><td>${esc(g.name)}</td><td class="mono">${g.count}</td><td class="c"><input type="checkbox" data-hide="${i}" ${hiddenPid.includes(g.name)?'checked':''} aria-label="${esc(g.name)} ausblenden"></td><td class="c"><input type="checkbox" data-lock="${i}" ${lockedPid.includes(g.name)?'checked':''} aria-label="${esc(g.name)} sperren"></td></tr>`).join('')||'<tr><td colspan="4">Keine Gruppen.</td></tr>'}
    </tbody></table></div></section>
  <section><h2>Kindersicherung</h2>
    <div class="card"><p class="sub" style="margin:0">${P.pin?'PIN ist gesetzt.':'Noch keine PIN gesetzt. Ohne PIN lassen sich Gruppen nicht sperren.'}</p>
    <div class="grid3"><div class="fld"><label for="pinNew">${P.pin?'Neue PIN':'PIN'} (4 Ziffern)</label><input id="pinNew" inputmode="numeric" pattern="\\d{4}" maxlength="4" type="password"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="pinSet">${P.pin?'PIN ändern':'PIN setzen'}</button>${S.unlocked?'<button class="btn" data-act="relock">Wieder sperren</button>':''}</div></div></section>
  <section><h2>Fernbedienung und Tastatur</h2><div class="card"><div class="keys">
    <kbd>↑ ↓</kbd><span>In der Kanalliste bewegen, OK/Enter spielt ab</span>
    <kbd>Kanal +/− · Bild ↑/↓</kbd><span>Kanal wechseln</span>
    <kbd>0–9</kbd><span>Kanalnummer eingeben</span>
    <kbd>Zurück · ⌫</kbd><span>Zum vorherigen Kanal</span>
    <kbd>G</kbd><span>TV-Guide</span><kbd>L</kbd><span>Live TV</span><kbd>F</kbd><span>Vollbild</span><kbd>S</kbd><span>Favorit umschalten</span></div></div></section>
  <section><h2>Daten</h2><div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="clearHist">Verlauf leeren</button><button class="btn danger" data-act="reset">${resetArm?'Wirklich alles löschen?':'Alles zurücksetzen'}</button></div>
    <p class="note">Aufnahmen auf Festplatte wie bei TiviMate sind im Browser nicht möglich. Catch-up funktioniert, wenn dein Anbieter Archive anbietet.</p></div></section>`;
}
async function onSettingsClick(e){
  const ab=e.target.closest('[data-add]');if(ab){addMode=ab.dataset.add;renderSettings();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a!=='del')delArm=null;if(a!=='reset')resetArm=false;
  if(a==='use'){await activate(id);go('live')}
  else if(a==='reload'){await activate(id);toast('Playlist neu geladen')}
  else if(a==='del'){if(delArm!==id){delArm=id;renderSettings();return}delArm=null;P.playlists=P.playlists.filter(x=>x.id!==id);dropText(id);['fav','hist','hidden','locked','last'].forEach(k=>delete P[k][id]);
    if(P.activeId===id){P.activeId=P.playlists[0]?P.playlists[0].id:null;save();await activate(P.activeId)}else{save();renderPlSel();renderSettings()}}
  else if(a==='epgSave'){const p=pl();p.epgUrl=$('#eUrl').value.trim();save();loadEPG(p).then(renderSettings);renderSettings()}
  else if(a==='pinSet'){const v=$('#pinNew').value;if(!/^\d{4}$/.test(v)){toast('Die PIN muss aus 4 Ziffern bestehen.');return}if(P.pin&&!(await askPin('Aktuelle PIN eingeben')))return;P.pin=v;save();toast('PIN gespeichert');renderSettings()}
  else if(a==='relock'){S.unlocked=false;refreshAll();renderSettings();toast('Gesperrte Gruppen sind wieder gesperrt')}
  else if(a==='clearHist'){P.hist[P.activeId]=[];save();renderGroups();toast('Verlauf geleert')}
  else if(a==='reset'){if(!resetArm){resetArm=true;renderSettings();return}try{Object.keys(localStorage).filter(k=>k.startsWith('ocmate.')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
}
async function onSettingsChange(e){
  const t=e.target,pid=P.activeId;
  if(t.dataset.hide!=null){const g=S.groups[+t.dataset.hide].name,h=arrOf(P.hidden,pid);t.checked?h.push(g):h.splice(h.indexOf(g),1);save();renderGroups();if(S.group===g)S.group='__all';renderChannels()}
  else if(t.dataset.lock!=null){const g=S.groups[+t.dataset.lock].name,l=arrOf(P.locked,pid);
    if(!P.pin){t.checked=false;toast('Setze zuerst unten eine PIN.');return}
    if(!t.checked&&!(await askPin())){t.checked=true;return}
    t.checked?l.push(g):l.splice(l.indexOf(g),1);save();refreshAll()}
  else if(t.id==='eOff'){P.epgOffset=+t.value||0;save();if(S.epgText){applyEPG(S.epgText,S.epgInfo.label);epgPill();refreshAll()}else if(pl()&&pl().type==='demo')loadEPG(pl())}
  else if(t.id==='eFile'&&t.files[0]){S.epgInfo={state:'busy'};epgPill();try{const txt=await bufToText(new Uint8Array(await t.files[0].arrayBuffer()));S.epgText=txt;applyEPG(txt,t.files[0].name)}catch(err){S.epgInfo={state:'err',msg:String(err.message||err)}}epgPill();refreshAll();renderSettings()}
}
async function onAdd(e){
  e.preventDefault();const id=uid(),name=$('#aName').value.trim()||'Playlist';let p;
  if(addMode==='url')p={id,name,type:'url',url:$('#aUrl').value.trim(),epgUrl:$('#aEpg').value.trim()};
  else if(addMode==='xtream')p={id,name,type:'xtream',server:$('#aSrv').value.trim(),user:$('#aUser').value.trim(),pass:$('#aPass').value,ext:$('#aExt').value};
  else{const f=$('#aFile').files[0];if(!f)return;const txt=await f.text();if(!/#EXTINF/i.test(txt)){toast('Die Datei sieht nicht wie eine M3U-Playlist aus.');return}
    p={id,name,type:'file',epgUrl:$('#aEpg').value.trim()};S.volatileText[id]=txt;if(!saveText(id,txt)){p.volatile=true;toast('Datei zu groß zum Speichern. Sie gilt nur bis zum Neuladen der Seite.')}}
  P.playlists.push(p);save();addMode='url';await activate(id);
  if(!S.loadErr){toast(`${S.channels.length} Kanäle geladen`);go('live')}else renderSettings();
}

/* ---------- Modal, PIN, Auswahl ---------- */
let modalDone=null;
function openModal(html,mount){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;mount&&mount(m);const f=m.querySelector('input,button.primary,button');f&&f.focus()}
function closeModal(v){const m=$('#modal');m.hidden=true;m.innerHTML='';if(modalDone){const d=modalDone;modalDone=null;d(v)}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal(null)});
function askPin(title='PIN eingeben'){
  if(!P.pin)return Promise.resolve(true);
  return new Promise(res=>{modalDone=res;
    openModal(`<h2>${esc(title)}</h2><p>Diese Inhalte sind durch die Kindersicherung gesperrt.</p><form id="pinF"><input class="pinin" id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"></form><p id="pinErr" class="note" style="color:var(--live)" hidden>Falsche PIN.</p><div class="acts"><button class="btn" data-x>Abbrechen</button><button class="btn primary" form="pinF">Entsperren</button></div>`,m=>{
      $('[data-x]',m).onclick=()=>closeModal(false);
      $('#pinF',m).onsubmit=ev=>{ev.preventDefault();if($('#pinIn').value===P.pin){S.unlocked=true;closeModal(true);refreshAll()}else{$('#pinErr').hidden=false;$('#pinIn').value=''}}})})
}
function pickChannel(title){
  return new Promise(res=>{modalDone=res;
    const L=S.channels.filter(c=>!isHidden(c)&&!(isLocked(c)&&!S.unlocked));
    const draw=q=>{const n=norm(q);const r=(n?L.filter(c=>norm(c.name).includes(n)):L).slice(0,200);$('#pkL').innerHTML=r.map(c=>rowHTML(c)).join('')||'<div class="empty">Nichts gefunden.</div>'};
    openModal(`<h2>${esc(title)}</h2><input id="pkQ" class="fld" style="background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px" placeholder="Kanal suchen" autocomplete="off"><div class="picklist" id="pkL"></div><div class="acts"><button class="btn" data-x>Abbrechen</button></div>`,m=>{
      draw('');$('#pkQ').oninput=e=>draw(e.target.value);$('[data-x]',m).onclick=()=>closeModal(null);
      $('#pkL').onclick=e=>{const r=e.target.closest('.row');if(r)closeModal(S.byKey.get(r.dataset.key))};$('#pkQ').focus()})})
}
let toastT=null;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------- Navigation ---------- */
function go(v){
  if(S.view==='multi'&&v!=='multi')stopMV();
  S.view=v;$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));$$('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===v));
  if(v==='guide')renderGuide();
  if(v==='settings')renderSettings();
  if(v==='multi'){video.pause();renderMV()}
}
function refreshAll(){renderGroups();renderChannels();renderInfo();ctrlState();if(S.view==='guide')renderGuide()}
function renderPlSel(){$('#plSel').innerHTML=P.playlists.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('#plSel').value=P.activeId||''}

async function activate(id){
  P.activeId=id;save();renderPlSel();
  stopVideo(video);showStage('<div class="big">Bereit</div>Wähle einen Kanal.');stopMV();
  S.current=null;S.prev=null;S.catchup=null;S.channels=[];S.byKey=new Map();S.groups=[];S.epg=new Map();S.epgText=null;S.epgInfo={state:'none'};S.headerEpg='';
  S.group='__all';S.guideGroup=null;S.mv.keys=[null,null,null,null];S.loadErr='';S.loading=true;epgPill();refreshAll();
  const p=pl();if(!p){S.loading=false;refreshAll();return}
  try{let r;
    if(p.type==='demo')r=parseM3U(DEMO_M3U,p.id);
    else if(p.type==='url'){const txt=await fetchText(p.url);if(!/#EXTINF/i.test(txt))throw new Error('Unter dem Link liegt keine M3U-Playlist.');r=parseM3U(txt,p.id)}
    else if(p.type==='file'){const txt=S.volatileText[p.id]||loadText(p.id);if(!txt)throw new Error('Die Datei ist nicht mehr gespeichert. Bitte erneut hinzufügen.');r=parseM3U(txt,p.id)}
    else if(p.type==='xtream'){r=await loadXtream(p);if(r.exp){p.exp=r.exp;save()}}
    if(P.activeId!==id)return;
    finalize(r.list);S.headerEpg=r.epgUrl||'';
  }catch(e){S.loadErr=netMsg(e)}
  S.loading=false;refreshAll();
  if(!S.loadErr)loadEPG(p);
}

/* ---------- Ereignisse ---------- */
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
$('#plSel').onchange=e=>activate(e.target.value);
let qT=null;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();if(S.view!=='live')go('live');renderGroups();renderChannels()},200)});
$('#groups').onclick=async e=>{const b=e.target.closest('.grp');if(!b)return;const g=b.dataset.g;
  if(!g.startsWith('__')&&isLockedGroup(P.activeId,g)&&!S.unlocked&&!(await askPin()))return;
  S.group=g;S.q='';$('#q').value='';renderGroups();renderChannels();if(innerWidth>=900)$('#chCol').scrollTop=0};
$('#chList').onclick=e=>{const r=e.target.closest('.row');if(r)play(S.byKey.get(r.dataset.key),{zapList:S.list})};
$('#chList').addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(!r)return;e.preventDefault();toggleFav(S.byKey.get(r.dataset.key))});
$('#hits').onclick=e=>{const b=e.target.closest('[data-hit]');if(!b)return;const[c,p]=$('#hits')._hits[+b.dataset.hit];openProg(c,p)};
$('#sched').onclick=e=>{const b=e.target.closest('[data-ps]');if(!b||!S.current)return;const p=progsOf(S.current)[+b.dataset.ps];if(p)openProg(S.current,p)};
$('#bPrevCh').innerHTML=ic('up');$('#bNextCh').innerHTML=ic('down');$('#bLast').innerHTML=ic('back')+' Letzter';$('#bPip').innerHTML=ic('pip');$('#bFull').innerHTML=ic('full');
$('#bPrevCh').onclick=()=>zap(-1);$('#bNextCh').onclick=()=>zap(1);
$('#bLast').onclick=()=>S.prev&&play(S.prev,{keepScroll:true});
$('#bFav').onclick=()=>toggleFav(S.current);
$('#bPip').onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await video.requestPictureInPicture()}catch(e){toast('Bild-in-Bild wird hier nicht unterstützt.')}};
function fullscreen(){const st=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(st.requestFullscreen)st.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}catch(e){}}
$('#bFull').onclick=fullscreen;
$('#gGroup').onchange=e=>{S.guideGroup=e.target.value;renderGuide()};
$('#gBack').innerHTML=ic('left');$('#gFwd').innerHTML=ic('right');
$('#gBack').onclick=()=>{S.guideStart-=2*36e5;renderGuide()};$('#gFwd').onclick=()=>{S.guideStart+=2*36e5;renderGuide()};
$('#gNow').onclick=()=>{S.guideStart=0;renderGuide();$('#gw').scrollLeft=0};
$('#gw').onclick=e=>{const gw=$('#gw');const pb=e.target.closest('[data-gplay]');if(pb){play(S.byKey.get(pb.dataset.gplay),{zapList:gw._chans});return}
  const b=e.target.closest('[data-gp]');if(!b)return;const[ri,pi]=b.dataset.gp.split(':').map(Number);const c=gw._chans[ri];openProg(c,progsOf(c)[pi])};
$$('[data-mv]').forEach(b=>b.onclick=()=>{S.mv.count=+b.dataset.mv;if(S.mv.focus>=S.mv.count)S.mv.focus=0;renderMV()});
$('#mvgrid').onclick=async e=>{const pk=e.target.closest('[data-mvpick]');if(pk){const i=+pk.dataset.mvpick;const c=await pickChannel('Kanal für Bild '+(i+1));if(c){if(isLocked(c)&&!S.unlocked&&!(await askPin()))return;S.mv.keys[i]=c.key;S.mv.focus=i;renderMV()}return}
  const cl=e.target.closest('[data-mvclear]');if(cl){S.mv.keys[+cl.dataset.mvclear]=null;renderMV();return}
  const s=e.target.closest('.slot');if(s){S.mv.focus=+s.dataset.slot;renderMV()}};
$('#set').addEventListener('click',onSettingsClick);
$('#set').addEventListener('change',onSettingsChange);
$('#set').addEventListener('submit',e=>{if(e.target.id==='addForm')onAdd(e)});

/* Fernbedienung: Pfeiltasten springen zum nächsten bedienbaren Element in dieser Richtung */
const ARROWS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
function spatial(dir){
  const scope=$('#modal').hidden?document:$('#modal');
  const els=$$('button,select,input,a[href],label.btn',scope).filter(el=>!el.disabled&&el.type!=='hidden'&&!el.hidden&&el.getClientRects().length&&!el.closest('[hidden]')&&!el.closest('.view:not(.on)'));
  const cur=els.includes(document.activeElement)?document.activeElement:null;
  if(!cur){const f=els.find(x=>x.classList.contains('on'))||els.find(x=>x.closest('.view.on,.modal'))||els[0];if(f){f.focus({preventScroll:true});f.scrollIntoView({block:'nearest',inline:'nearest'})}return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,h=dir==='ArrowLeft'||dir==='ArrowRight';let best=null,bd=Infinity;
  for(const el of els){if(el===cur)continue;const b=el.getBoundingClientRect();
    const ok=dir==='ArrowRight'?b.left>=r.right-4:dir==='ArrowLeft'?b.right<=r.left+4:dir==='ArrowDown'?b.top>=r.bottom-4:b.bottom<=r.top+4;if(!ok)continue;
    const dx=Math.abs(b.left+b.width/2-cx),dy=Math.abs(b.top+b.height/2-cy);const d=h?dx+dy*4:dy+dx*2;if(d<bd){bd=d;best=el}}
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'})}
}
/* Zurück-Taste der App: true = von OCMate erledigt, false = App schließen */
window.ocBack=function(){
  if(!$('#modal').hidden){closeModal(null);return true}
  if(document.fullscreenElement){document.exitFullscreen();return true}
  if(S.view!=='live'){go('live');return true}
  if(document.activeElement&&document.activeElement.matches('input,select')){document.activeElement.blur();return true}
  return false;
};

document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal(null);else if(ARROWS.includes(e.key)&&!(e.target.tagName==='INPUT'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))){e.preventDefault();spatial(e.key)}return}
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'){if(e.key==='Escape')e.target.blur();
    else if(ARROWS.includes(e.key)&&(tag==='select'||((e.key==='ArrowUp'||e.key==='ArrowDown')&&tag==='input'&&e.target.type!=='number'))){e.preventDefault();spatial(e.key)}return}
  const k=e.key;
  if(/^[0-9]$/.test(k)&&S.view==='live'){S.numBuf=(S.numBuf+k).slice(-4);osd(`<span class="mono">${S.numBuf}_</span>`,0);clearTimeout(S.numTimer);
    S.numTimer=setTimeout(()=>{const n=+S.numBuf;S.numBuf='';const c=S.channels.find(x=>x.num===n&&!isHidden(x));if(c)play(c,{keepScroll:true});else osd(`<span class="mono">${n}</span> Kein Kanal`)},1500);return}
  if(k==='ChannelUp'||k==='PageUp'||k==='+'){e.preventDefault();zap(-1);return}
  if(k==='ChannelDown'||k==='PageDown'||k==='-'){e.preventDefault();zap(1);return}
  if(ARROWS.includes(k)){
    const rows=S.view==='live'?$$('#chList .row'):[];const i=rows.indexOf(document.activeElement);
    const nothing=!document.activeElement||document.activeElement===document.body;
    if(rows.length&&nothing&&(k==='ArrowDown'||k==='ArrowUp')){e.preventDefault();const r=rows.find(x=>x.classList.contains('on'))||rows[0];r.focus();r.scrollIntoView({block:'nearest'});return}
    if(i>=0&&(k==='ArrowDown'||(k==='ArrowUp'&&i>0))){e.preventDefault();const n=rows[i+(k==='ArrowDown'?1:-1)];if(n){n.focus();n.scrollIntoView({block:'nearest'})}else more();return}
    e.preventDefault();spatial(k);return}
  if(k==='Backspace'||k==='BrowserBack'||k==='GoBack'){if(S.prev){e.preventDefault();play(S.prev,{keepScroll:true})}return}
  const l=k.toLowerCase();
  if(l==='f')fullscreen();else if(l==='g')go('guide');else if(l==='l')go('live');else if(l==='s')toggleFav(S.current);
});

setInterval(()=>{if(S.view==='live'){refreshRows();if(S.current&&$('#modal').hidden)renderInfo()}},60000);

/* ---------- Start ---------- */
if(!P.playlists.length){P.playlists.push({id:'demo',name:'OCMate Demo',type:'demo'});P.activeId='demo';save()}
if(!pl())P.activeId=P.playlists[0].id;
buildMV();renderPlSel();activate(P.activeId);
</script>
