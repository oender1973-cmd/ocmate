# Xcode-Projekt wird daraus mit XcodeGen erzeugt:  xcodegen generate
name: OCMate
options:
  bundleIdPrefix: de.onder
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9"
    CURRENT_PROJECT_VERSION: "10"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  OCMate:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Oberfläche (dieselbe wie Android/Samsung), als Ordner ins App-Paket
      - path: web
        type: folder
    info:
      path: OCMate-Info.plist
      properties:
        CFBundleDisplayName: OCMate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # IPTV-Server liefern meist über http
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.onder.ocmate
        PRODUCT_NAME: OCMate
